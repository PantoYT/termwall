[package]
name = "termwall"
version = "3.0.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "A live system-stats wallpaper in the style of fastfetch: its own stats server and wallpaper host"
license = "MIT"
repository = "https://github.com/PantoYT/termwall"
readme = "README.md"
# The Python version and the page live in this folder too; the crate needs only these.
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std", "preserve_order"] }
indexmap = "2"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp", "bmp"] }
miniz_oxide = "0.9"
getrandom = "0.4"
sha2 = "0.11"
unicode-normalization = "0.1"
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
# the same version wry brings in; COM interfaces for WASAPI (windows-sys has none)
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_SystemInformation",
] }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
